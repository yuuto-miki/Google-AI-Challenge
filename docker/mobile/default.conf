server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/walk-tls/server.crt;
    ssl_certificate_key /etc/nginx/walk-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / { proxy_pass http://web; }
    location /walk/ { proxy_pass http://web; }
    location / { return 404; }

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @unavailable;
    location @unavailable { return 503 "Game temporarily unavailable."; }
}
